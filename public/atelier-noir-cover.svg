<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250">
  <title>Atelier Noir — editorial interior design visual</title>
  <desc>A warm arched interior in charcoal, sand and bronze, with a sculptural vessel and refined serif typography.</desc>

  <defs>
    <linearGradient id="archFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAD2AE"/>
      <stop offset="0.32" stop-color="#D5B084"/>
      <stop offset="0.68" stop-color="#9C7653"/>
      <stop offset="1" stop-color="#4E3826"/>
    </linearGradient>
    <linearGradient id="vesselFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2E6D3"/>
      <stop offset="0.55" stop-color="#D6BE9D"/>
      <stop offset="1" stop-color="#8D6F4F"/>
    </linearGradient>
    <linearGradient id="floorFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2118"/>
      <stop offset="1" stop-color="#15110D"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFEBCB" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFEBCB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="44%" r="76%">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.48"/>
    </radialGradient>
    <clipPath id="archClip">
      <path d="M250 1035V545a250 250 0 0 1 500 0v490Z"/>
    </clipPath>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1000" height="1250" fill="#12100D"/>

  <g clip-path="url(#archClip)">
    <rect x="250" y="250" width="500" height="790" fill="url(#archFill)"/>
    <ellipse cx="500" cy="330" rx="300" ry="240" fill="url(#halo)"/>

    <path d="M340 1035V620a160 160 0 0 1 320 0v415Z" fill="#3A2B1E" opacity="0.42"/>

    <path d="M590 290L750 420V1035H590Z" fill="#FFF2DC" opacity="0.05"/>
    <path d="M610 290L690 350V1035H610Z" fill="#FFF2DC" opacity="0.04"/>

    <g fill="#1A130D" opacity="0.2">
      <rect x="556" y="420" width="12" height="615"/>
      <rect x="594" y="420" width="7" height="615"/>
      <rect x="640" y="420" width="16" height="615"/>
      <rect x="700" y="420" width="8" height="615"/>
    </g>

    <rect x="250" y="1020" width="500" height="15" fill="#0F0C09" opacity="0.55"/>
    <rect x="250" y="1035" width="500" height="80" fill="url(#floorFill)"/>

    <rect x="422" y="878" width="156" height="157" fill="#1C1610"/>
    <rect x="422" y="878" width="156" height="4" fill="#8E7253" opacity="0.45"/>

    <path
      d="M474 879c-17-33-13-66 2-89 9-14 9-20 4-34h40c-5 14-5 20 4 34 15 23 19 56 2 89Z"
      fill="url(#vesselFill)"
    />
    <path d="M484 757h32" stroke="#B69A78" stroke-width="2" opacity="0.6"/>
    <path d="M478 868c6-13 11-26 13-41" stroke="#FFF1DD" stroke-width="3" opacity="0.22" fill="none"/>

    <g fill="#17120D">
      <rect x="286" y="970" width="172" height="9" rx="2"/>
      <rect x="298" y="979" width="6" height="56"/>
      <rect x="440" y="979" width="6" height="56"/>
    </g>
    <path d="M330 970c0-14 10-22 24-22s24 8 24 22Z" fill="#B79A76"/>

    <ellipse cx="500" cy="1035" rx="190" ry="20" fill="#E8C79E" opacity="0.08"/>
  </g>

  <path d="M250 1035V545a250 250 0 0 1 500 0v490" fill="none" stroke="#F0E7D8" stroke-opacity="0.16"/>
  <path d="M64 1035H936" stroke="#F0E7D8" stroke-opacity="0.08"/>

  <g fill="#F0E7D8">
    <text
      x="64"
      y="84"
      font-family="'Instrument Serif', Georgia, 'Times New Roman', serif"
      font-size="30"
      letter-spacing="9"
    >ATELIER NOIR</text>
    <text
      x="936"
      y="80"
      text-anchor="end"
      font-family="'Azeret Mono', ui-monospace, monospace"
      font-size="10"
      letter-spacing="3"
      fill="#B9AC99"
    >INTERIOR DESIGN</text>
  </g>
  <path d="M64 108H936" stroke="#F0E7D8" stroke-opacity="0.14"/>
  <text
    x="64"
    y="146"
    font-family="'Azeret Mono', ui-monospace, monospace"
    font-size="10"
    letter-spacing="3"
    fill="#8E8374"
  >SELECTED SPACES / 01</text>

  <text
    x="64"
    y="1108"
    font-family="'Azeret Mono', ui-monospace, monospace"
    font-size="10"
    letter-spacing="4"
    fill="#B9AC99"
  >SPACES — OBJECTS — LIGHT</text>
  <text
    x="64"
    y="1200"
    font-family="'Instrument Serif', Georgia, 'Times New Roman', serif"
    font-size="82"
    font-style="italic"
    fill="#F0E7D8"
  >Light, held still.</text>
  <text
    x="936"
    y="1200"
    text-anchor="end"
    font-family="'Azeret Mono', ui-monospace, monospace"
    font-size="10"
    letter-spacing="3"
    fill="#8E8374"
  >A STUDY IN QUIET</text>

  <rect width="1000" height="1250" fill="url(#vignette)"/>
  <rect width="1000" height="1250" filter="url(#grain)" opacity="0.09" style="mix-blend-mode:overlay"/>
</svg>
